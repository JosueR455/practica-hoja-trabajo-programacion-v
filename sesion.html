<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
</head>
<body>

    <header>
        <h1>Iniciar Sesión</h1>
    </header>

    <main>
        <h2>Accede a tu cuenta</h2>
        <p>Introduce tu correo y contraseña para ingresar.</p>

        <!--action="autenticar.php" method="POST">-->
        <form action="perfil.html">
        <!--en este caso la acción solo mandará al html "perfil.html" porque no hay forma de hacer la validación de usuaruis-->

        
            <label for="correo">Correo Electrónico:</label>
            <input type="email" id="correo" name="correo" required><br><br>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required><br><br>

            <button type="submit">Ingresar</button>
        </form>

        <p>¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
        <!--el href debe encontrar la otra pagina "registro.html", deben coincidir los nombres-->
    </main>

    <footer>
        <p>Josue Rodríguez (000128502)</p>
    </footer>

</body>
