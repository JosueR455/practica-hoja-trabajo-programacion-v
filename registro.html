<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
</head>
<body>
    <header>
        <h1>Registro de Usuario</h1>
    </header>
    
    <main>
        <h2>Complete el formulario para registrarse</h2>
        <form action="guardar_registro.php" method="POST">
            <!--en este caso la acción no guardará la información porque no hay un servidor al cuál enviar la información-->

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required><br><br>
            <!--el "for="nombre" en label hace referencia al name="nombre" en el input-->

            <label for="correo">Correo Electrónico:</label>
            <input type="email" id="correo" name="correo" required><br><br>
            
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required><br><br>
            
            <label for="genero">Género:</label>
            <select id="genero" name="genero">
                <option value="masculino">Masculino</option>
                <option value="femenino">Femenino</option>
                <option value="otro">Otro</option>
            </select><br><br>
            
            <label for="comentario">Dirección (opcional):</label><br>
            <textarea id="comentario" name="comentario" rows="4" cols="50"></textarea><br><br>
            
            <label for="pais">Departamento:</label>
            <select id="pais" name="pais">
                <option value="gt">Guatemala</option>
                <option value="gt">Chimaltenango</option>
                <option value="gt">Petén</option>
                <option value="gt">Chiquimula</option>
            </select><br><br>

            <button type="submit">Registrarse</button>
            
        </form>
    </main>
    
    <footer>
        <p>Josue Rodríguez (000128502)</p>
        <!--&copy; con esta instrucción creo el signo de marca registrada-->
    </footer>
</body>
</html>
